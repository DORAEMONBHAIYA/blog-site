# Phase 5 — unattended pipeline: ingest new TMDB releases, then generate content.
# Runs on schedule (free GitHub Actions cron, every 3h) plus manual dispatch
# for watched runs. Writes go to Supabase only — never back to the repo, so
# the token stays least-privilege (contents: read).
name: pipeline

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      ingest_limit:
        description: "Max titles to ingest"
        default: "150"
        required: false
      generate_limit:
        description: "Max releases to generate content for"
        default: "40"
        required: false

permissions:
  contents: read

concurrency:
  group: ott-pipeline
  cancel-in-progress: false

jobs:
  ingest-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ingest new releases from TMDB
        run: npm run ingest -- --max-titles=${{ inputs.ingest_limit || '150' }}
      - name: Generate content for unprocessed releases
        run: npm run generate -- --limit=${{ inputs.generate_limit || '40' }}
